name: Five-Short cloud pilot

on:
  workflow_dispatch:
  schedule:
    - cron: '7 13 * * *'

concurrency:
  group: shorts-public-pilot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  pilot:
    if: vars.SHORTS_PILOT_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install -r requirements.txt
      - name: Run pilot
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PILOT_YOUTUBE_CHANNEL_ID: ${{ secrets.PILOT_YOUTUBE_CHANNEL_ID || vars.PILOT_YOUTUBE_CHANNEL_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python pilot.py
      - name: Stop the schedule after five receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c 'import json, pathlib, sys; p = pathlib.Path("pilot-progress.json"); sys.exit(not (p.exists() and sum(bool(x.get("video_id")) for x in json.loads(p.read_text()).values()) == 5))'; then
            gh workflow disable shorts-pilot.yml
          fi
