name: Discover and render Shorts

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      count:
        description: Number of discovery Shorts to generate (1-5)
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      seconds:
        description: Optional target duration in seconds when count is 1 (12-85; blank = audio-driven)
        required: false
        default: ''
        type: string
      hq_script:
        description: Use Gemini 4 Hydrogen for script generation only (18 RPD cap)
        required: false
        default: false
        type: boolean
      loop:
        description: Render a seamless loop without an outro follow card
        required: false
        default: false
        type: boolean
      publish_target:
        description: Save draft only or publish after rendering
        required: true
        default: both
        type: choice
        options:
          - draft
          - youtube
          - instagram
          - both

permissions:
  contents: write

jobs:
  discover:
    if: vars.SPARK_RENDER_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      USE_LOCAL_GPU: ${{ vars.USE_LOCAL_GPU || 'false' }}
      SHORTS_FPS: ${{ vars.SHORTS_FPS || '30' }}
      SHORTS_KOKORO_VOICE: ${{ vars.SHORTS_KOKORO_VOICE || 'auto' }}
      ENABLE_PEXELS: ${{ vars.ENABLE_PEXELS || 'false' }}
      NARRATION_SPEED: ${{ vars.NARRATION_SPEED || '1.0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "kokoro-onnx>=0.4.7,<1"
      - name: Prepare voices and captions
        run: |
          if [ -n "$SHORTS_KOKORO_VOICE" ]; then
            python shorts.py setup-kokoro
          else
            python shorts.py setup-voice
          fi
          python shorts.py setup-captions
      - name: Generate discovery Shorts
        env:
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_ZERO_COST_MODEL: ${{ vars.POLLINATIONS_ZERO_COST_MODEL }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_PAGE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_TOKEN_EXPIRES_AT: ${{ secrets.INSTAGRAM_TOKEN_EXPIRES_AT || vars.INSTAGRAM_TOKEN_EXPIRES_AT }}
          SPARK_YOUTUBE_CHANNEL_ID: ${{ secrets.SPARK_YOUTUBE_CHANNEL_ID || vars.SPARK_YOUTUBE_CHANNEL_ID }}
          SPARK_INSTAGRAM_ACCOUNT_ID: ${{ secrets.SPARK_INSTAGRAM_ACCOUNT_ID || vars.SPARK_INSTAGRAM_ACCOUNT_ID }}
          SPARK_INSTAGRAM_USERNAME: ${{ secrets.SPARK_INSTAGRAM_USERNAME || vars.SPARK_INSTAGRAM_USERNAME }}
          INPUT_COUNT: ${{ inputs.count || '1' }}
          INPUT_SECONDS: ${{ inputs.seconds }}
          INPUT_HQ_SCRIPT: ${{ inputs.hq_script || 'false' }}
          INPUT_LOOP: ${{ inputs.loop || 'false' }}
          INPUT_PUBLISH_TARGET: ${{ inputs.publish_target || 'both' }}
          EVENT_NAME: ${{ github.event_name }}
          CAN_PUBLIC_PUBLISH: ${{ github.event.repository.private || vars.SPARK_PUBLIC_PUBLISH_ENABLED == 'true' }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            COUNT=$(python -c 'import random; print(random.randint(1, 4))')
            PUBLISH_TARGET="both"
            DELAY_SECONDS=120
            SECONDS_ARG=""
            echo "Scheduled run selected count=$COUNT with 120s pacing."
          else
            COUNT="$INPUT_COUNT"
            PUBLISH_TARGET="$INPUT_PUBLISH_TARGET"
            DELAY_SECONDS=0
            SECONDS_ARG="$INPUT_SECONDS"
          fi
          if [ "$PUBLISH_TARGET" != "draft" ] && [ "$CAN_PUBLIC_PUBLISH" != "true" ]; then
            echo "Public publishing blocked unless SPARK_PUBLIC_PUBLISH_ENABLED=true." >&2
            exit 1
          fi
          python instagram_publish.py check-token || true
          args=(discover-batch --count "$COUNT" --platform "$PUBLISH_TARGET" --delay-seconds "$DELAY_SECONDS" --qa-gate --summary-file state/run_summary.json)
          if [ "$COUNT" = "1" ] && [ -n "$SECONDS_ARG" ]; then
            args+=(--seconds "$SECONDS_ARG")
          fi
          if [ "$INPUT_HQ_SCRIPT" = "true" ]; then
            args+=(--hq-script)
          fi
          if [ "$INPUT_LOOP" = "true" ]; then
            args+=(--loop)
          fi
          python shorts.py "${args[@]}"
      - name: Commit published history
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.publish_target != 'draft') }}
        run: |
          if [ ! -f state/published_history.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/published_history.json
          if ! git diff --cached --quiet -- state/published_history.json; then
            git commit -m "chore: update published_history.json [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
      - name: Notify run summary
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          INSTAGRAM_PAGE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_TOKEN_EXPIRES_AT: ${{ secrets.INSTAGRAM_TOKEN_EXPIRES_AT || vars.INSTAGRAM_TOKEN_EXPIRES_AT }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify.py --status "${{ job.status }}" --summary state/run_summary.json --run-url "$GITHUB_RUN_URL"
      - name: Upload rendered drafts
        if: ${{ (success() || failure()) && (github.event.repository.private || vars.SPARK_SAVE_PUBLIC_ARTIFACTS == 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovered-shorts
          path: |
            output/**/short.mp4
            output/**/preview.png
            output/**/captions.ass
            output/**/metadata.json
            output/**/gemini-discovery.json
            output/**/gemini-requests.json
            output/**/flow-prompt.txt
          if-no-files-found: ignore
          retention-days: 3
