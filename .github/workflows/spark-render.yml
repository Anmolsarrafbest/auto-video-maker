name: Render a Spark idea

on:
  workflow_dispatch:
    inputs:
      idea_json:
        description: One validated Spark idea as a JSON string
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spark-render-${{ fromJSON(inputs.idea_json).request_id }}
  cancel-in-progress: false

jobs:
  render:
    if: vars.SPARK_RENDER_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      USE_LOCAL_GPU: ${{ vars.USE_LOCAL_GPU || 'false' }}
      SHORTS_FPS: ${{ vars.SHORTS_FPS || '30' }}
      SHORTS_KOKORO_VOICE: ${{ vars.SHORTS_KOKORO_VOICE || 'auto' }}
      ENABLE_PEXELS: ${{ vars.ENABLE_PEXELS || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate the idea
        run: python -m pip install -r requirements.txt "kokoro-onnx>=0.4.7,<1" && python spark_job.py --mode validate
      - name: Prepare local voices and captions
        run: |
          if [ -n "$SHORTS_KOKORO_VOICE" ]; then
            python shorts.py setup-kokoro
          else
            python shorts.py setup-voice
          fi
          python shorts.py setup-captions
      - name: Render and optionally publish
        env:
          SPARK_MODE: ${{ (github.event.repository.private || vars.SPARK_PUBLIC_PUBLISH_ENABLED == 'true') && vars.SPARK_PUBLISH_MODE || 'draft' }}
          SPARK_YOUTUBE_CHANNEL_ID: ${{ secrets.SPARK_YOUTUBE_CHANNEL_ID || vars.SPARK_YOUTUBE_CHANNEL_ID }}
          SPARK_INSTAGRAM_ACCOUNT_ID: ${{ secrets.SPARK_INSTAGRAM_ACCOUNT_ID || vars.SPARK_INSTAGRAM_ACCOUNT_ID }}
          SPARK_INSTAGRAM_USERNAME: ${{ secrets.SPARK_INSTAGRAM_USERNAME || vars.SPARK_INSTAGRAM_USERNAME }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_PAGE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PAGE_ACCESS_TOKEN }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_ZERO_COST_MODEL: ${{ vars.POLLINATIONS_ZERO_COST_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: python spark_job.py --mode "$SPARK_MODE"
      - name: Save preview
        if: ${{ (success() || failure()) && (github.event.repository.private || vars.SPARK_SAVE_PUBLIC_ARTIFACTS == 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spark-short
          path: |
            output/**/spark-*/short.mp4
            output/**/spark-*/metadata.json
            output/**/spark-*/flow-prompt.txt
          if-no-files-found: ignore
          retention-days: 1
